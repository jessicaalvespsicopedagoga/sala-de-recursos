<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Primeiro Livro Interativo · Jessica Alves</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b3a55;--blue:#4f9bd4;--sand:#e7dcc8;--gold:#f2c14e;--ok:#3e9b6a;--err:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f1ea;font-family:Nunito,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.book{width:min(720px,100%);padding:12px;perspective:1600px;flex:1}
.page{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(43,58,85,.08);padding:22px 18px 16px;min-height:560px;display:none;flex-direction:column;transform-origin:left center}
.page.on{display:flex}
.page.turn{animation:turn .45s ease}
@keyframes turn{from{transform:rotateY(-14deg);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page.turn,.shake{animation:none!important}}
.eye{font:600 12px Fredoka;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
h1,h2{font-family:Fredoka;font-weight:600;margin:4px 0 6px}
h2{font-size:24px}.ins{margin:0 0 16px;font-size:16px}
.area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.foot{margin-top:14px;font-size:12px;color:#8a93a6;text-align:center}.foot b{color:var(--gold)}
.msg{min-height:26px;font-weight:700;text-align:center}.msg.ok{color:var(--ok)}.msg.no{color:var(--err)}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 18px}
.nav button.arr{width:46px;height:46px;border-radius:50%;border:none;background:#fff;font-size:24px;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer}
.dots{display:flex;gap:7px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--sand)}.dots i.cur{background:var(--blue)}.dots i.done{background:var(--ok)}
.btn{font:600 16px Fredoka;border:none;border-radius:12px;padding:11px 20px;background:var(--blue);color:#fff;cursor:pointer}
.btn.l{background:var(--sand);color:var(--ink)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
img{user-select:none;-webkit-user-drag:none}
/* capa */
.cover{align-items:center;text-align:center;justify-content:center;gap:12px}
.cover h1{font-size:34px;line-height:1.1}.cover img{width:160px}
.cover input{font:16px Nunito;padding:10px 14px;border:2px solid var(--sand);border-radius:12px;width:240px;text-align:center}
/* vogais */
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.legend button{width:54px;height:54px;border-radius:12px;border:3px solid transparent;font:600 24px Fredoka;color:var(--ink);cursor:pointer}
.legend button.sel{border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:440px}
.vgrid button{aspect-ratio:1;border:2px solid #cfd5df;border-radius:12px;background:#fff;font:600 32px Fredoka;color:var(--ink);cursor:pointer;transition:background .2s}
/* alfabeto */
.agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;max-width:470px}
.cell{aspect-ratio:1;border:2px solid #cfd5df;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 26px Fredoka;position:relative}
.cell.drop{border-style:dashed;border-color:var(--blue);font-size:13px;color:#a8b0bf}
.cell.drop.hi{background:#eef5fb}
.cell img{width:80%;height:80%;object-fit:contain}
.cell img.fz{position:absolute;top:2px;left:2px;width:42%;height:42%;pointer-events:none}.cell .lt{color:var(--ok)}.cell small{position:absolute;bottom:1px;right:4px;font-size:12px;color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:470px;min-height:66px;padding:6px;border-radius:12px;background:#faf8f3}
.chip{width:60px;height:60px;border-radius:12px;background:#fff;border:2px solid #e5e8ee;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.chip img{width:50px;height:50px;object-fit:contain;pointer-events:none}
.chip.sel{border-color:var(--blue)}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9}
/* maior menor */
.row{display:flex;justify-content:space-around;align-items:center;width:100%;max-width:470px;height:120px;border:2px solid #e5e8ee;border-radius:14px}
.row button{background:none;border:none;position:relative;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;width:110px;height:110px}
.row img{object-fit:contain}
.mk{position:absolute;inset:0;pointer-events:none}
.step{font:600 18px Fredoka}
/* labirinto */
svg.maze{width:100%;max-width:440px}
.mz{fill:none;stroke:#cdd6e3;stroke-width:20;stroke-linecap:round;cursor:pointer}
.mz.ok{stroke:#9fd3b6}.mz.no{stroke:#f0b9b7}
/* sombras */
.sgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sgrid button{width:110px;height:130px;border:2px solid #e5e8ee;border-radius:14px;background:#fff;cursor:pointer}
.sgrid img{width:90px;height:110px;object-fit:contain}
.sgrid button.ok{border-color:var(--ok);background:#eef8f2}
/* conte */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:470px}
.cbox{border:2px solid #e5e8ee;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fr{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:84px;align-items:center}.fr img{width:38px;height:38px;object-fit:contain}
.cbox .cell{width:56px;aspect-ratio:1}
.num{width:52px;height:52px;border-radius:12px;background:#fff;border:2px solid #e5e8ee;font:600 24px Fredoka;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
/* relatorio */
.rep{font-size:14px}.rep #rbody{overflow-x:auto}.rep table{width:100%;border-collapse:collapse;margin:8px 0}.rep th,.rep td{border:1px solid #e5e8ee;padding:5px;text-align:center}.rep th{background:#faf8f3}
.rep label{display:block;margin:3px 0}.rep textarea{width:100%;min-height:70px;border:2px solid var(--sand);border-radius:10px;font:14px Nunito;padding:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{display:flex;gap:6px;align-items:center;font-size:13px;color:#6b7488;justify-content:flex-end}
@media print{body{background:#fff}.nav,.tools,.sw,.noprint{display:none!important}.page{display:flex!important;box-shadow:none;page-break-after:always;min-height:0}.book{width:100%}body.blank .rep,body.blank .cover .sw{display:none!important}.page.rep{page-break-after:auto}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const FOOT='<div class="foot"><b>★</b> Jessica Alves · Psicopedagogia e Desenvolvimento</div>';
const PAGES=[];let cur=0,showHint=true,child='';
const ST={};// por página
const praise=['Muito bem!','Isso mesmo!','Você conseguiu!','Ótimo trabalho!','Arrasou!'];
function stat(id){return ST[id]||(ST[id]={t0:0,time:0,ok:0,err:0,tries:0,hint:0,pause:0,last:0,done:false,errs:[]})}
function act(id){const s=stat(id),n=Date.now();if(s.last)s.pause=Math.max(s.pause,n-s.last);s.last=n}
function good(id,el){const s=stat(id);act(id);s.ok++;s.tries++;say(id,praise[Math.floor(Math.random()*praise.length)],1)}
function bad(id,el,exp,got){const s=stat(id);act(id);s.err++;s.tries++;s.errs.push([exp,got]);if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}say(id,'Quase! Tente de novo.',0)}
function say(id,t,ok){const m=$('#msg-'+id);if(m){m.textContent=t;m.className='msg '+(ok?'ok':'no')}}
function finish(id,t){const s=stat(id);if(!s.done){s.done=true;say(id,t||'Página concluída! ★',1);dots()}}
function page(id,eye,title,ins,body){return `<section class="page" data-id="${id}"><div class="eye">${eye}</div><h2>${title}</h2><p class="ins">${ins}</p><div class="area" id="a-${id}">${body}</div><div class="msg" id="msg-${id}"></div>${FOOT}</section>`}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- arrastar (com toque também) ---------- */
let picked=null;
function draggable(el,onDrop){
  el.addEventListener('pointerdown',e=>{
    const sx=e.clientX,sy=e.clientY;let g=null,moved=false;el.setPointerCapture(e.pointerId);
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;g=el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g)}
      if(g){g.style.left=ev.clientX-30+'px';g.style.top=ev.clientY-30+'px';document.querySelectorAll('.drop').forEach(d=>d.classList.remove('hi'));const t=dropAt(ev);if(t)t.classList.add('hi')}};
    const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);document.querySelectorAll('.drop').forEach(d=>d.classList.remove('hi'));
      if(g){g.remove();const t=dropAt(ev);if(t)onDrop(el,t)}else{if(picked)picked.classList.remove('sel');picked=el;el.classList.add('sel')}};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
}
function dropAt(ev){const els=document.elementsFromPoint(ev.clientX,ev.clientY);return els.find(x=>x.classList&&x.classList.contains('drop'))}
document.addEventListener('click',e=>{const d=e.target.closest('.drop');if(d&&picked){const p=picked;picked.classList.remove('sel');picked=null;p._drop(p,d)}});
function mkDrag(el,fn){el._drop=fn;draggable(el,fn)}

/* ---------- capa ---------- */
PAGES.push({id:'capa',html:`<section class="page cover" data-id="capa"><img src="${IMG.logo}" alt="Jessica Alves Psicopedagoga"><div class="eye">E-book gratuito</div><h1>Meu primeiro<br>livro interativo</h1><p>Escreva seu nome:</p><input id="nome" placeholder="Nome da criança" autocomplete="off"><button class="btn" onclick="go(1)">Começar</button><button class="btn l noprint" onclick="document.body.classList.add('blank');print()">Imprimir para usar no papel</button><div class="sw noprint"><label><input type="checkbox" id="hintsw" checked> Mostrar dicas</label></div>${FOOT}</section>`,init(){
  $('#nome').oninput=e=>child=e.target.value;$('#hintsw').onchange=e=>showHint=e.target.checked}});

/* ---------- 1 vogais ---------- */
const VC={A:'#f6dc8a',E:'#b7dcae',I:'#f2b8b5',O:'#a9cfee',U:'#d9c4ea'};
const VL='UEAOIEOIAUEIOOUA'.split('');
PAGES.push({id:'vogais',html:page('vogais','Vogais · 1 de 6','Pinte as vogais','Escolha uma cor da legenda e toque nas letras iguais.',
 `<div class="legend">${Object.keys(VC).map(v=>`<button data-v="${v}" style="background:${VC[v]}">${v}</button>`).join('')}</div><div class="vgrid">${VL.map((v,i)=>`<button data-v="${v}">${v}</button>`).join('')}</div>`),init(){
  let sel=null,left=VL.length;const a=$('#a-vogais');
  a.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>{a.querySelectorAll('.legend button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.v});
  a.querySelectorAll('.vgrid button').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;if(!sel){say('vogais',showHint?'Primeiro escolha uma cor na legenda.':'',0);return}
    if(sel===b.dataset.v){b.style.background=VC[sel];b.dataset.done=1;good('vogais');if(--left===0)finish('vogais')}else{if(showHint)stat('vogais').hint++;bad('vogais',b,'cor da letra '+b.dataset.v,'cor da letra '+sel)}});
}});

/* ---------- 2 alfabeto ---------- */
const FR={B:['banana','Banana'],C:['coco','Coco'],G:['goiaba','Goiaba'],J:['jaca','Jaca'],K:['kiwi','Kiwi'],M:['maca','Maçã'],P:['pitaya','Pitaya'],T:['tangerina','Tangerina'],U:['uva','Uva']};
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
PAGES.push({id:'alfabeto',html:page('alfabeto','Alfabeto · 2 de 6','Complete o alfabeto','Olhe a fruta e arraste a letra que começa o nome dela.',
 `<div class="agrid">${ABC.map(l=>FR[l]?`<div class="cell drop" data-l="${l}"><img class="fz" src="${IMG[FR[l][0]]}" alt="${FR[l][1]}" title="${FR[l][1]}"></div>`:`<div class="cell">${l}</div>`).join('')}</div><div class="tray" id="tray-abc"></div>`),init(){
  const tr=$('#tray-abc');let left=9;
  shuffle(Object.keys(FR)).forEach(l=>{const c=document.createElement('div');c.className='num';c.dataset.l=l;c.textContent=l;tr.appendChild(c);
    mkDrag(c,(el,t)=>{if(t.dataset.l===el.dataset.l){t.classList.remove('drop');t.insertAdjacentHTML('beforeend',`<span class="lt">${l}</span>`);el.style.visibility='hidden';good('alfabeto');if(--left===0)finish('alfabeto')}
      else{bad('alfabeto',el,FR[t.dataset.l][1]+' → '+t.dataset.l,FR[t.dataset.l][1]+' → '+el.dataset.l);if(showHint){stat('alfabeto').hint++;say('alfabeto','Fale o nome devagar: '+FR[t.dataset.l][1]+'. Qual é o primeiro som?',0)}}})});
}});

/* ---------- 3 maior/menor ---------- */
const MM=[['limao',[.7,1,.75]],['maca',[.8,.45,1]],['pera',[1,.75,.5]],['pessego',[.55,.8,1]],['laranja',[.75,1,.4]]];
PAGES.push({id:'maior',html:page('maior','Maior e menor · 3 de 6','Maior e menor','<span class="step" id="mm-step"></span>',
 `${MM.map((r,i)=>`<div class="row" data-r="${i}">${r[1].map((s,j)=>`<button data-s="${s}"><img src="${IMG[r[0]]}" style="width:${s*100}px;height:${s*100}px" alt=""><svg class="mk" viewBox="0 0 110 110"></svg></button>`).join('')}</div>`).join('')}`),init(){
  let row=0,phase='menor';const upd=()=>$('#mm-step').innerHTML=phase==='menor'?'Toque na fruta <b>MENOR</b> e ela ganha um círculo.':'Agora toque na fruta <b>MAIOR</b> e ela ganha um X.';upd();
  const rows=[...document.querySelectorAll('#a-maior .row')];rows.forEach((r,i)=>r.style.opacity=i?'.35':'1');
  rows.forEach((r,i)=>r.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(i!==row)return;const ss=[...r.querySelectorAll('button')].map(x=>+x.dataset.s),s=+b.dataset.s;
    const want=phase==='menor'?Math.min(...ss):Math.max(...ss);
    if(s===want){b.querySelector('svg').innerHTML=phase==='menor'?'<circle cx="55" cy="55" r="50" fill="none" stroke="#4f9bd4" stroke-width="5"/>':'<path d="M18 18L92 92M92 18L18 92" stroke="#d9534f" stroke-width="6" stroke-linecap="round"/>';good('maior');
      if(phase==='menor')phase='maior';else{phase='menor';row++;if(row<rows.length)rows[row].style.opacity='1';else{finish('maior');$('#mm-step').textContent='';return}}upd()}
    else bad('maior',b,'fruta '+phase+' (linha '+(i+1)+')','escolheu outra')}));
}});

/* ---------- 4 labirinto ---------- */
PAGES.push({id:'lab',html:page('lab','Labirinto · 4 de 6','Labirinto','Qual caminho leva a torta até o prato? Toque no caminho.',
 `<svg class="maze" viewBox="0 0 440 400">
  <path class="mz" data-ok="0" d="M90 70 C 220 40, 300 120, 400 90 S 380 200, 300 200"/>
  <path class="mz" data-ok="1" d="M80 70 C 60 160, 180 160, 200 220 S 120 320, 250 330 S 330 330, 340 330"/>
  <path class="mz" data-ok="0" d="M70 90 C 20 200, 160 260, 120 370"/>
  <image href="${IMG.torta}" x="20" y="20" width="110" height="100"/>
  <image href="${IMG.menino}" x="320" y="250" width="110" height="140"/>
 </svg>`),init(){
  document.querySelectorAll('#a-lab .mz').forEach((p,i)=>p.onclick=()=>{if(stat('lab').done)return;if(p.dataset.ok==='1'){p.classList.add('ok');good('lab');finish('lab','Isso! A torta chegou ao prato. ★')}else{p.classList.add('no');bad('lab',null,'caminho que chega ao prato','caminho '+(i+1)+' (sem saída)');setTimeout(()=>p.classList.remove('no'),900)}})
}});

/* ---------- 5 sombras ---------- */
PAGES.push({id:'sombra',html:page('sombra','Sombras · 5 de 6','Jogo das sombras','Observe a menina e toque na sombra certa.',
 `<img src="${IMG.menina}" style="width:170px" alt="Menina com prato de frutas"><div class="sgrid">${shuffle(['s1','s2','s3']).map(s=>`<button data-s="${s}"><img src="${IMG[s]}" alt="sombra"></button>`).join('')}</div>`),init(){
  document.querySelectorAll('#a-sombra .sgrid button').forEach(b=>b.onclick=()=>{if(stat('sombra').done)return;if(b.dataset.s==='s1'){b.classList.add('ok');good('sombra');finish('sombra')}else{bad('sombra',b,'sombra com o prato de frutas','sombra sem o prato');if(showHint){stat('sombra').hint++;say('sombra','Olhe as mãos da menina: o que ela está segurando?',0)}}})
}});

/* ---------- 6 conte ---------- */
const CT=[['pera',3],['maca',5],['pessego',2],['laranja',4]];
PAGES.push({id:'conte',html:page('conte','Números · 6 de 6','Conte as frutas','Conte cada grupo e arraste o número certo para o quadrinho.',
 `<div class="cgrid">${CT.map(c=>`<div class="cbox"><div class="fr">${`<img src="${IMG[c[0]]}" alt="">`.repeat(c[1])}</div><div class="cell drop" data-n="${c[1]}">?</div></div>`).join('')}</div><div class="tray" id="tray-n"></div>`),init(){
  const tr=$('#tray-n');let left=4;[1,2,3,4,5,6].forEach(n=>{const c=document.createElement('div');c.className='num';c.textContent=n;c.dataset.n=n;tr.appendChild(c);
    mkDrag(c,(el,t)=>{if(t.dataset.n===el.dataset.n){t.classList.remove('drop');t.textContent=el.dataset.n;t.style.color='#3e9b6a';el.style.visibility='hidden';good('conte');if(--left===0)finish('conte')}else{bad('conte',el,t.dataset.n,el.dataset.n);if(showHint){stat('conte').hint++;say('conte','Conte de novo, tocando em cada fruta com o dedo.',0)}}})});
}});

/* ---------- relatório ---------- */
const NOMES={vogais:'Vogais',alfabeto:'Alfabeto',maior:'Maior/menor',lab:'Labirinto',sombra:'Sombras',conte:'Conte e arraste'};
const OBS=['Reconhece as vogais','Associa letra inicial ao nome da fruta','Compara tamanhos (maior/menor)','Planejamento visual no labirinto','Discriminação visual (sombras)','Contagem termo a termo','Associa quantidade ao numeral','Manteve atenção na tarefa','Precisou de mediação do adulto','Coordenação para arrastar'];
PAGES.push({id:'rel',html:`<section class="page rep" data-id="rel"><div class="eye">Para o terapeuta</div><h2>Relatório da atividade</h2><div id="rbody"></div><h3 style="font-family:Fredoka;margin:12px 0 4px">Observações clínicas</h3>${OBS.map(o=>`<label><input type="checkbox"> ${o}</label>`).join('')}<p><textarea id="notas" placeholder="Anotações livres"></textarea></p><div class="tools"><button class="btn" onclick="copy()">Copiar relatório</button><button class="btn l" onclick="document.body.classList.remove('blank');print()">Imprimir com resultado</button><button class="btn l" onclick="document.body.classList.add('blank');print()">Imprimir em branco</button></div><div class="msg" id="msg-rel"></div>${FOOT}</section>`,init(){},show:renderRep});
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+'min '+(s%60)+'s'};
function renderRep(){let h=`<p><b>Criança:</b> ${child||'—'} &nbsp; <b>Data:</b> ${new Date().toLocaleDateString('pt-BR')}</p><table><tr><th>Página</th><th>Tempo</th><th>Acertos</th><th>Erros</th><th>Tentativas</th><th>Dicas</th><th>Maior pausa</th><th>Concluída</th></tr>`;
 const er=[];for(const k in NOMES){const s=stat(k);h+=`<tr><td>${NOMES[k]}</td><td>${fmt(s.time)}</td><td>${s.ok}</td><td>${s.err}</td><td>${s.tries}</td><td>${s.hint}</td><td>${fmt(s.pause)}</td><td>${s.done?'Sim':'Não'}</td></tr>`;s.errs.forEach(e=>er.push(`${NOMES[k]}: esperado ${e[0]}; respondeu ${e[1]}`))}
 h+='</table><b>Erros</b><ul>'+(er.length?er.map(e=>`<li>${e}</li>`).join(''):'<li>Nenhum erro registrado.</li>')+'</ul>';$('#rbody').innerHTML=h}
function copy(){renderRep();const r=$('.rep');let t='Meu primeiro livro interativo — '+(child||'—')+' — '+new Date().toLocaleDateString('pt-BR')+'\n';
 for(const k in NOMES){const s=stat(k);t+=`${NOMES[k]}: tempo ${fmt(s.time)}, acertos ${s.ok}, erros ${s.err}, tentativas ${s.tries}, dicas ${s.hint}, maior pausa ${fmt(s.pause)}, ${s.done?'concluída':'não concluída'}\n`;s.errs.forEach(e=>t+=`  - esperado ${e[0]}; respondeu ${e[1]}\n`)}
 const ob=[...r.querySelectorAll('label')].filter(l=>l.querySelector('input').checked).map(l=>l.textContent.trim());if(ob.length)t+='Observações: '+ob.join('; ')+'\n';if($('#notas').value)t+='Anotações: '+$('#notas').value;
 navigator.clipboard.writeText(t).then(()=>say('rel','Relatório copiado!',1),()=>say('rel','Não foi possível copiar.',0))}

/* ---------- navegação ---------- */
$('#book').innerHTML=PAGES.map(p=>p.html).join('');PAGES.forEach(p=>p.init());
const els=[...document.querySelectorAll('.page')];
function dots(){$('#dots').innerHTML=PAGES.map((p,i)=>`<i class="${i===cur?'cur':''} ${ST[p.id]&&ST[p.id].done?'done':''}"></i>`).join('')}
let enter=Date.now();
function go(i){if(i<0||i>=PAGES.length)return;const o=PAGES[cur].id;if(ST[o]||NOMES[o])stat(o).time+=Date.now()-enter;
 els[cur].classList.remove('on','turn');cur=i;enter=Date.now();const s=NOMES[PAGES[i].id]&&stat(PAGES[i].id);if(s)s.last=Date.now();
 els[i].classList.add('on','turn');if(PAGES[i].show)PAGES[i].show();dots();scrollTo(0,0)}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
els[0].classList.add('on');dots();
</script></body></html>
